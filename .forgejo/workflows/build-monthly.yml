---
name: Build action
enable-email-notifications: true
on:
  schedule:
    - cron: '0 3 6 * *'
      timezone: Europe/Berlin

jobs:
  build:
    name: Build bundle
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
      - name: Set image tag
        id: image_tag
        # run:  echo "::set-output name=tag::$(date +%Y%m%d)"
        run:  echo "tag=$(date +%Y%m%d)" >> $FORGEJO_OUTPUT
      - name: Build image
        run: docker build -t registry.nbg.bufanda.de/bufanda/traefik-certificate-extractor:latest .
      - name: Tag image with daily tag
        run: docker tag registry.nbg.bufanda.de/bufanda/traefik-certificate-extractor:latest registry.nbg.bufanda.de/bufanda/traefik-certificate-extractor:${{ steps.image_tag.outputs.tag }}
      - name: push tagged images
        run: docker push registry.nbg.bufanda.de/bufanda/traefik-certificate-extractor:${{ steps.image_tag.outputs.tag }}
      - name: push latest images
        run: docker push registry.nbg.bufanda.de/bufanda/traefik-certificate-extractor:latest
